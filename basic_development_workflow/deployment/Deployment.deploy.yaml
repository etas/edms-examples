yaaa_version: 0.5

imports:
  - HelloWorld.activity_graph

deployment_targets:
  - name: mw_1
    type: noviroc

deployed_instances:
  - activity_instance: consumer
    deploy_to: mw_1
    thread_pool_size: 1
    core_affinity: [0]
    importance: 10
  - activity_instance: producer
    deploy_to: mw_1
    thread_pool_size: 1
    core_affinity: [0]
    importance: 10

measurement_config:
  - name: raw_gateway
    deploy_to: mw_1
    stimulus:
      kind: cyclic
      cycle_ms: 200
    cache_config:
      default_cache_size: 2